

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d19">
<title>JARVIS AI</title>
<style>
:root {
  --bg:#080d19;
  --panel:#111c2d;
  --blue:#42baff;
  --cyan:#79e7ff;
  --text:#edf7ff;
  --muted:#91a5bd;
  --line:rgba(120,190,255,.15);
}
*{box-sizing:border-box}
body{
  margin:0;background:
  radial-gradient(ellipse at 50% 15%,#12345a 0%,transparent 45%),
  var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
.app{
  max-width:850px;margin:auto;min-height:100vh;
  min-height:100dvh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  display:flex;flex-direction:column;
}
header{
  height:68px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;color:#061321;
  font-weight:900;background:linear-gradient(140deg,#a6edff,#278bd9);
  box-shadow:0 0 20px #39aaff55;
}
.brandname{font-weight:850;letter-spacing:3px}
.brandsub{font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:4px}
.status{font-size:11px;color:#75e8ae;display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#65e7a2;box-shadow:0 0 9px #65e7a2}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.hero{text-align:center;padding:12px 0 4px}
.orb-area{height:190px;display:grid;place-items:center}
.orb{
  width:125px;height:125px;border-radius:50%;position:relative;
  display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#e3fbff 0%,#64cfff 8%,#1766a9 35%,#07172d 74%);
  box-shadow:0 0 30px #28aaff66,0 0 80px #1689df30,inset 0 0 25px #b9f1ff55;
  transition:.3s;
}
.orb:before,.orb:after{
  content:"";position:absolute;inset:-12px;border:1px solid #62caff55;
  border-radius:50%;animation:spin 12s linear infinite;
}
.orb:after{inset:-23px;border-color:#62caff25;animation-duration:19s;animation-direction:reverse}
.orb-core{font-size:15px;font-weight:850;letter-spacing:2px;text-shadow:0 0 12px white}
.orb.listening{animation:pulse 1.5s infinite}
.orb.thinking{animation:think .9s infinite alternate}
.orb.speaking{animation:pulse .65s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes think{to{transform:scale(1.08);filter:hue-rotate(25deg)}}
.hero h1{font-size:22px;letter-spacing:3px;margin:0}
.subtitle{font-size:13px;color:var(--muted);margin-top:7px;min-height:18px}
.mode{font-size:10px;color:var(--cyan);letter-spacing:2px;margin-top:10px}
.chat{
  flex:1;min-height:150px;max-height:42vh;overflow-y:auto;
  padding:12px 2px 18px;scroll-behavior:smooth;
}
.message{display:flex;margin:12px 0}
.message.user{justify-content:flex-end}
.message-inner{max-width:88%}
.message-label{font-size:10px;color:var(--muted);letter-spacing:1px;margin:0 4px 5px}
.bubble{
  padding:13px 15px;border-radius:16px;font-size:14px;
  line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;
}
.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:5px}
.user .bubble{background:linear-gradient(135deg,#176eae,#174b7c);border-top-right-radius:5px}
.composer{
  display:flex;gap:9px;align-items:center;padding:12px 0;
  border-top:1px solid var(--line);
}
#messageInput{
  min-width:0;flex:1;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:15px;padding:15px;
  outline:none;font-size:15px;
}
#messageInput:focus{border-color:var(--blue)}
.action{
  width:46px;height:46px;border:1px solid var(--line);
  border-radius:14px;background:#14243a;color:var(--text);
  display:grid;place-items:center;font-size:19px;
}
.primary{background:linear-gradient(140deg,#62caff,#1878bd);color:#061321;border:0}
.active{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px #35baff35}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:4px 0 17px}
.small{
  background:transparent;color:#b9cde1;border:1px solid var(--line);
  border-radius:30px;padding:9px 13px;font-size:12px;
}
footer{text-align:center;color:#637991;font-size:10px;padding:0 0 12px;letter-spacing:1px}
@media(min-width:650px){.orb-area{height:215px}.chat{max-height:46vh}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">J</div>
    <div>
      <div class="brandname">JARVIS</div>
      <div class="brandsub">PERSONAL AI SYSTEM</div>
    </div>
  </div>
  <div class="status"><span class="dot"></span><span id="statusText">SYSTEM READY</span></div>
</header>

<main>
  <section class="hero">
    <div class="orb-area">
      <div class="orb" id="orb"><div class="orb-core">J.A.R.V.I.S</div></div>
    </div>
    <h1>AT YOUR SERVICE</h1>
    <div class="subtitle" id="subtitle">Your personal AI assistant is ready.</div>
    <div class="mode" id="modeLabel">CHAT MODE</div>
  </section>

  <section class="chat" id="chat">
    <div class="message assistant">
      <div class="message-inner">
        <div class="message-label">JARVIS</div>
        <div class="bubble">Welcome back, boss. I'm ready when you are.</div>
      </div>
    </div>
  </section>

  <form class="composer" id="chatForm">
    <input id="messageInput" placeholder="Message JARVIS..." autocomplete="off">
    <button class="action" id="micButton" type="button" aria-label="Activate voice">🎙</button>
    <button class="action primary" type="submit" aria-label="Send">➤</button>
  </form>

  <div class="controls">
    <button class="small" id="voiceButton">Activate listening</button>
    <button class="small" id="stopButton">Stop speaking</button>
    <button class="small" id="languageButton">Voice: English</button>
    <button class="small" id="clearButton">New conversation</button>
  </div>
</main>
<footer>JARVIS AI · ALWAYS AT YOUR SERVICE</footer>
</div>

<script>
const $ = id => document.getElementById(id);

const orb = $("orb");
const chat = $("chat");
const input = $("messageInput");

let history = [];
let busy = false;
let voiceEnabled = false;
let awaitingCommand = false;
let speaking = false;
let recognition = null;
let voiceLanguage = "en-IN";
let restartTimer = null;
let sessionNumber = 0;

function setState(state, detail) {
  orb.className = "orb" + (state === "ready" ? "" : " " + state);

  const labels = {
    ready: ["SYSTEM READY", "Your personal AI assistant is ready."],
    listening: ["LISTENING", "I'm listening, boss."],
    thinking: ["PROCESSING", "Give me a moment, boss."],
    speaking: ["SPEAKING", "JARVIS is responding."],
    error: ["CONNECTION ISSUE", detail || "Please try again."]
  };

  const item = labels[state] || labels.ready;
  $("statusText").textContent = item[0];
  $("subtitle").textContent = detail || item[1];
}

function addMessage(role, text) {
  const row = document.createElement("div");
  row.className = "message " + role;

  const inner = document.createElement("div");
  inner.className = "message-inner";

  const label = document.createElement("div");
  label.className = "message-label";
  label.textContent = role === "user" ? "YOU" : "JARVIS";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  inner.append(label, bubble);
  row.append(inner);
  chat.append(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function addThinking() {
  const row = addMessage("assistant", "Thinking...");
  row.id = "thinkingMessage";
  return row;
}

function chooseVoice(text) {
  return /[\u0900-\u097F]/.test(text) ? "hi-IN" : "en-IN";
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    setState("ready", "Speech output is not supported in this browser.");
    return;
  }

  // Stop the microphone before speaking to prevent feedback.
  stopRecognition();

  speechSynthesis.cancel();
  speaking = true;
  setState("speaking");

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = chooseVoice(text);
  utterance.rate = 1.04;
  utterance.pitch = 0.92;
  utterance.volume = 1;

  const voices = speechSynthesis.getVoices();
  const language = utterance.lang.toLowerCase();

  const preferred = voices.find(v =>
    v.lang.toLowerCase() === language
  ) || voices.find(v =>
    v.lang.toLowerCase().startsWith(language.split("-")[0])
  );

  if (preferred) utterance.voice = preferred;

  utterance.onend = () => {
    speaking = false;
    if (voiceEnabled) {
      setState("listening");
      scheduleRecognitionRestart();
    } else {
      setState("ready");
    }
  };

  utterance.onerror = () => {
    speaking = false;
    if (voiceEnabled) scheduleRecognitionRestart();
    else setState("ready");
  };

  speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  speaking = false;

  if (voiceEnabled) {
    setState("listening");
    scheduleRecognitionRestart();
  } else {
    setState("ready");
  }
}

async function askJarvis(text) {
  text = text.trim();
  if (!text || busy) return;

  busy = true;
  stopRecognition();

  addMessage("user", text);
  history.push({ role: "user", text });

  setState("thinking");
  const thinking = addThinking();

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 50000);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.slice(-16) }),
      signal: controller.signal
    });

    let data;
    try {
      data = await response.json();
    } catch {
      throw new Error("The server returned an invalid response.");
    }

    if (!response.ok) {
      throw new Error(data.error || "AI connection failed.");
    }

    if (typeof data.reply !== "string" || !data.reply.trim()) {
      throw new Error("JARVIS returned an empty response.");
    }

    thinking.remove();
    history.push({ role: "model", text: data.reply });
    addMessage("assistant", data.reply);

    // Every successful reply is spoken automatically.
    speak(data.reply);

  } catch (error) {
    thinking.remove();

    const message = error.name === "AbortError"
      ? "The request took too long. Please try again."
      : error.message || "Connection failed.";

    addMessage("assistant", "I'm sorry, boss. " + message);
    setState("error", message);

    if (voiceEnabled) speak("I'm sorry, boss. " + message);

  } finally {
    clearTimeout(timeout);
    busy = false;

    if (!speaking && voiceEnabled) scheduleRecognitionRestart();
  }
}

$("chatForm").addEventListener("submit", event => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  askJarvis(text);
});

function stopRecognition() {
  clearTimeout(restartTimer);

  if (recognition) {
    recognition.onend = null;
    try { recognition.abort(); } catch {}
    recognition = null;
  }
}

function makeRecognition() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) return null;

  const r = new SpeechRecognition();
  r.continuous = false;
  r.interimResults = false;
  r.maxAlternatives = 1;
  r.lang = voiceLanguage;

  const thisSession = ++sessionNumber;

  r.onresult = event => {
    if (thisSession !== sessionNumber || busy || speaking) return;

    const text = event.results[0][0].transcript.trim();
    if (!text) return;

    handleVoiceText(text);
  };

  r.onerror = event => {
    if (thisSession !== sessionNumber) return;

    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      voiceEnabled = false;
      awaitingCommand = false;
      updateVoiceButtons();
      setState("error", "Please allow microphone access.");
    }
  };

  r.onend = () => {
    if (thisSession !== sessionNumber) return;
    recognition = null;
    if (voiceEnabled && !busy && !speaking) {
      scheduleRecognitionRestart();
    }
  };

  return r;
}

function handleVoiceText(text) {
  const lower = text.toLowerCase().trim();

  const stopPhrases = [
    "stop speaking", "stop talking", "jarvis stop",
    "stop jarvis", "be quiet", "shut up",
    "chup", "bas", "ruk jao", "band karo",
    "रुको", "बस", "चुप", "बंद करो"
  ];

  if (stopPhrases.some(p => lower.includes(p))) {
    stopSpeaking();
    return;
  }

  const wake = /\b(?:hey\s+jarvis|hi\s+jarvis|jarvis)\b/i;
  const match = text.match(wake);

  if (match) {
    const command = text.replace(wake, "").trim();

    if (command) {
      awaitingCommand = false;
      askJarvis(command);
    } else {
      awaitingCommand = true;
      speak("Yes, boss?");
    }
    return;
  }

  if (awaitingCommand) {
    awaitingCommand = false;
    askJarvis(text);
  }
}

function scheduleRecognitionRestart() {
  clearTimeout(restartTimer);

  if (!voiceEnabled || busy || speaking) return;

  restartTimer = setTimeout(() => {
    startRecognition();
  }, 900);
}

function startRecognition() {
  if (!voiceEnabled || busy || speaking || recognition) return;

  const next = makeRecognition();

  if (!next) {
    voiceEnabled = false;
    updateVoiceButtons();
    setState("error", "Speech recognition is not supported here. Try Safari.");
    return;
  }

  recognition = next;

  try {
    next.start();
    setState("listening");
  } catch (error) {
    recognition = null;
    scheduleRecognitionRestart();
  }
}

function updateVoiceButtons() {
  $("voiceButton").textContent =
    voiceEnabled ? "Turn listening off" : "Activate listening";

  $("micButton").classList.toggle("active", voiceEnabled);

  $("modeLabel").textContent =
    voiceEnabled ? "VOICE MODE · SAY HEY JARVIS" : "CHAT MODE";
}

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setState("error", "This browser does not support voice recognition.");
    return;
  }

  voiceEnabled = true;
  awaitingCommand = false;
  updateVoiceButtons();
  startRecognition();
}

function stopVoice() {
  voiceEnabled = false;
  awaitingCommand = false;
  stopRecognition();
  updateVoiceButtons();
  setState("ready");
}

$("voiceButton").addEventListener("click", () => {
  if (voiceEnabled) stopVoice();
  else startVoice();
});

$("micButton").addEventListener("click", () => {
  if (voiceEnabled) stopVoice();
  else startVoice();
});

$("stopButton").addEventListener("click", stopSpeaking);

$("languageButton").addEventListener("click", () => {
  voiceLanguage = voiceLanguage === "en-IN" ? "hi-IN" : "en-IN";

  $("languageButton").textContent =
    voiceLanguage === "en-IN" ? "Voice: English" : "Voice: Hindi";

  if (voiceEnabled) {
    stopRecognition();
    startRecognition();
  }
});

$("clearButton").addEventListener("click", () => {
  history = [];
  chat.innerHTML = "";
  addMessage("assistant", "Fresh start, boss. What shall we work on?");
  setState("ready");
});

if ("speechSynthesis" in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

</script>
</body>
</html>
